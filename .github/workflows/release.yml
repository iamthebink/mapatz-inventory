name: Verified desktop release
on:
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to verify and publish
        required: true
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test && pnpm test:e2e && pnpm build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-diagnostics
          path: |
            test-results
            playwright-report
  verify:
    strategy:
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:package
      - run: pnpm test:desktop
      - run: pnpm desktop:make
      - name: Install Windows artifact and verify installed app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop-stage/out/make -Filter '*Setup.exe' -Recurse | Select-Object -First 1
          $process = Start-Process $installer.FullName -ArgumentList '--silent' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installation failed' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Playwright must attach to Electron itself, not Squirrel's root launcher shim.
          $installed = Join-Path $env:LOCALAPPDATA "mapatz_inventory/app-$version/mapatz-inventory.exe"
          if (!(Test-Path $installed -PathType Leaf)) { throw "Installed executable missing: $installed" }
          Write-Host "Testing installed executable: $installed"
          $env:MAPATZ_EXECUTABLE = $installed
          pnpm test:desktop --max-failures=1
          if ($LASTEXITCODE -ne 0) { throw 'Installed application verification failed' }
      - name: Verify extracted Mac distributable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          artifact="$(find desktop-stage/out/make -name '*.zip' -type f | head -n 1)"
          ditto -x -k "$artifact" "$RUNNER_TEMP/mapatz-installed"
          MAPATZ_EXECUTABLE="$RUNNER_TEMP/mapatz-installed/Mapatz Inventory.app/Contents/MacOS/mapatz-inventory" pnpm test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: desktop-stage/out/make
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: test-results-desktop
  upgrade:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/windows-upgrade.yml
    with:
      artifact: packages-windows-latest
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  publish:
    needs: [regression, verify, upgrade]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: packages, pattern: 'packages-*', merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          artifacts=()
          while IFS= read -r -d '' artifact; do
            artifacts+=("$artifact")
          done < <(find packages -type f -print0)
          if (( ${#artifacts[@]} == 0 )); then
            echo 'No verified release artifacts were downloaded' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" "${artifacts[@]}"
